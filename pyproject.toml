[project]
name = "polyglot"
version = "0.1.0"
description = "Real-time multilingual transcription and translation TUI"
requires-python = ">=3.14"
dependencies = [
    "argostranslate>=1.11.0",
    "deep-translator>=1.11.4",
    "lingua-language-detector>=2.2.0",
    "numpy",
    "openai-whisper",
    "openvino>=2026.4.1; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "pulsectl>=24.12.0",
    "rich>=15.0.0",
    "scipy",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.5",
    "speechbrain>=1.1.0",
    "textual>=8.2.8",
    "torch",
    "torchaudio",
    "transformers>=4.44",
]

[project.scripts]
polyglot = "app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Flat layout: the application is a set of top-level modules, not a package.
# Listing them explicitly keeps setuptools from guessing (and from pulling in
# the test_*.py files or failing on multiple top-level modules).
[tool.setuptools]
py-modules = [
    "app",
    "audio",
    "inference_backend",
    "openvino_decoder",
    "sentence_buffer",
    "speech_quality",
    "suppress_alsa",
    "transcriber",
    "translator",
]

# Keep PyTorch and its audio extension on matching CPU builds by default.
# See https://docs.astral.sh/uv/guides/integration/pytorch/ for GPU indexes.
# AMD users can reuse a distro ROCm PyTorch instead; see README.md,
# "Using a distro ROCm PyTorch".
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
